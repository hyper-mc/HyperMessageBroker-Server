# Defina a porta na qual o servidor deve ser iniciado
port: 25365
# Defina a quantidade de threads do pool
poolSize: 4
# Defina o delay para limpeza de mensagens já vistas ou antigas demais
cleanDelay: 5 # em segundos
# Tempo máximo que um cliente pode ficar sem enviar ONLINE antes de ser desconectado.
tokenTimeoutSeconds: 10
# Tempo máximo que uma mensagem permanece guardada antes de ser descartada.
messageTtlSeconds: 120
# Limite de mensagens em memória por fila (para evitar vazamentos).
maxMessagesPerQueue: 1000
